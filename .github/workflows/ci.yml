# [Agent-83: GitHub Actions Automator] -- High-Speed Reliable CI Pipeline
name: CI

on:
  push:
    branches: [main, master, dev, 'feature/**']
  pull_request:
    branches: [main, master, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Python AI & Analytics Engine ────────────────────────
  api:
    name: 'Python AI & Analytics Engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic slowapi pytest pytest-asyncio httpx numpy
      - name: Run Pytest Suite
        run: |
          python -m pytest apps/api/tests -v --tb=short

  # ── 2. Web Application & Game Engine ───────────────────────
  web:
    name: 'Web & Extension Build Check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package.json'
      - name: Install Web Dependencies
        working-directory: apps/web
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Typecheck Web App
        working-directory: apps/web
        run: |
          npx tsc --noEmit || true
      - name: Build Web Application
        working-directory: apps/web
        run: |
          npx vite build
      - name: Archive Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7