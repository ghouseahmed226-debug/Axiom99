# [Agent-88: Cloudflare Edge Manager] -- Production Deployment Pipeline
name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy-web:
    name: Build & Package Production Web Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/web/package.json'
      - name: Install Web Dependencies
        working-directory: apps/web
        run: |
          npm install --legacy-peer-deps --prefer-offline --no-audit --no-fund
      - name: Build Web Application
        working-directory: apps/web
        run: |
          npx vite build
      - name: Archive Production Package
        uses: actions/upload-artifact@v4
        with:
          name: nexusweb-production-bundle
          path: apps/web/dist/